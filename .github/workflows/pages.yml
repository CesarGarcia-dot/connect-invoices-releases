name: Publish installer to Pages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download MSI from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "site/v1.0.0"
          gh release download v1.0.0 \
            --repo "${{ github.repository }}" \
            --pattern "ConnectInvoices-Setup-1.0.0-x64.msi" \
            --dir "site/v1.0.0"

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
